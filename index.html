*{box-sizing:border-box;margin:0;padding:0}

body{font-family:Inter,sans-serif;background:var(--bg);color:var(--fg);font-size:13.5px;line-height:1.5;padding:16px}

.hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--acc)}

h1{font-size:17px;font-weight:800}.hdr p{font-size:11px;color:var(--fg-m)}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}

.kpi-val{font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

.kpi-label{font-size:10px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}

.kpi-sub{font-size:11px;color:var(--fg-m);margin-top:3px}

.gain{color:var(--grn);font-weight:700}.dip{color:var(--red);font-weight:700}.neu{color:var(--fg-m)}

.chart-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-m)}

svg.chart{width:100%;overflow:visible}

.tooltip{position:fixed;background:var(--fg);color:var(--bg);padding:7px 11px;border-radius:7px;font-size:11px;pointer-events:none;display:none;z-index:999;white-space:nowrap;font-family:JetBrains Mono,monospace;line-height:1.7;box-shadow:var(--sh2)}

.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow-x:auto;margin-bottom:16px}

table{width:100%;border-collapse:collapse;min-width:580px}

thead th{background:var(--surface2);padding:7px 10px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-m);border-bottom:1px solid var(--border);white-space:nowrap}

thead th.left{text-align:left}

tbody tr:hover{background:var(--bg)}

tbody td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;font-family:JetBrains Mono,monospace}

tbody td.left{text-align:left;font-family:Inter,sans-serif;font-size:12.5px;padding-left:22px}

td.cgrn{background:var(--grn-cell);color:var(--grn);font-weight:600}

td.cred{background:var(--red-cell);color:var(--red);font-weight:700}

tfoot td{background:var(--surface2);font-weight:700;border-top:2px solid var(--border);font-size:12px;text-align:right;font-family:JetBrains Mono,monospace}

tfoot td.left{text-align:left;font-family:Inter,sans-serif}

.zhdr{background:var(--acc-d)}

.zhdr td{font-family:Inter,sans-serif;text-align:left;font-weight:700;font-size:12px;padding:6px 10px;color:var(--fg)}

.updated{font-size:10px;color:var(--fg-f);font-family:JetBrains Mono,monospace}

function tM(doc,m){if(!doc)return 0;if(m==="dau")return doc.total_unique_riders;let t=0;for(const z of ZONES)for(const c of CT[z])t+=gM(doc,z,c,m);return t}
function zT(doc,z,m){if(!doc)return 0;if(m==="dau"){let s=0;for(const c of CT[z])s+=gM(doc,z,c,"dau");return s}let s=0;for(const c of CT[z])s+=gM(doc,z,c,m);return s}

function getActiveZones(){const v=document.getElementById("zoneSel").value;return v==="all"?ZONES:[v]}

function initSel(){
  const s=document.getElementById("dateSel");
  DATA.slice().reverse().forEach((d,i)=>{const o=document.createElement("option");o.value=d.date;o.text=d.date+(i===0?" (latest)":"");s.appendChild(o)});
  s.value=DATA[DATA.length-1].date;
  // init range selectors
  const rf=document.getElementById("rangeFrom"),rt=document.getElementById("rangeTo");
  DATA.forEach(d=>{
    const o1=document.createElement("option");o1.value=d.date;o1.text=d.date;rf.appendChild(o1);
    const o2=document.createElement("option");o2.value=d.date;o2.text=d.date;rt.appendChild(o2);
  });
  // default: last 7 days
  const n=DATA.length;
  rf.value=DATA[Math.max(0,n-7)].date;
  rt.value=DATA[n-1].date;
  renderRange();
}

function render(){
  const date=document.getElementById("dateSel").value;
  const metric=document.getElementById("metricSel").value;
  const activeZones=getActiveZones();
  const doc=DATA.find(d=>d.date===date),idx=DATA.indexOf(doc);
  const prev=idx>0?DATA[idx-1]:null;
  const dau=doc?.total_unique_riders??0,pdau=prev?.total_unique_riders??0,dod=dau-pdau;
  const opd=tM(doc,"opd"),popd=tM(prev,"opd"),del=tM(doc,"delivered"),hubs=tM(doc,"hubs"),dp=opd?Math.round(del/opd*100):0;
  document.getElementById("kpiRow").innerHTML=`<div class="kpi"><div class="kpi-label">Total DAU</div><div class="kpi-val" style="color:var(--acc)">${fmt(dau)}</div><div class="kpi-sub ${dod<0?"dip":dod>0?"gain":"neu"}">${dod>0?"+":""}${dod} DoD</div></div><div class="kpi"><div class="kpi-label">Total OPD</div><div class="kpi-val">${fmt(opd)}</div><div class="kpi-sub ${opd<popd?"dip":"gain"}">${popd?((opd-popd)/popd*100).toFixed(1)+"% DoD":"&mdash;"}</div></div><div class="kpi"><div class="kpi-label">Delivered</div><div class="kpi-val">${fmt(del)}</div><div class="kpi-sub">${dp}% delivery rate</div></div><div class="kpi"><div class="kpi-label">Active Hubs</div><div class="kpi-val">${fmt(hubs)}</div><div class="kpi-sub">of 287 authorised</div></div>`;
  document.getElementById("updatedAt").textContent="Updated: "+(doc?.updated_at?.slice(0,16)||date);
  let html='<thead><tr><th class="left">Zone / City</th><th>Riders</th><th>Prev</th><th>DoD</th><th>OPD</th><th>Del%</th><th>Hubs</th></tr></thead><tbody>';
  let tc=0,tp=0,to=0,td2=0,th2=0;
  for(const z of activeZones){html+=`<tr class="zhdr"><td colspan="7">${z} Zone &mdash; ${fmt(zT(doc,z,"dau"))} riders &middot; ${fmt(zT(doc,z,"opd"))} OPD</td></tr>`;
    for(const c of CT[z]){const cur=gM(doc,z,c,metric),pv=gM(prev,z,c,metric),dif=cur-pv,o2=gM(doc,z,c,"opd"),d2=gM(doc,z,c,"delivered"),h2=gM(doc,z,c,"hubs"),dp2=o2?Math.round(d2/o2*100):0;
      html+=`<tr><td class="left">${c}</td><td class="${cur>pv?"cgrn":cur<pv&&cur>0?"cred":""}">${fmt(cur)}</td><td style="color:var(--fg-m)">${fmt(pv)}</td><td class="${dif<0?"dip":dif>0?"gain":"neu"}">${dif>0?"+":""}${fmt(dif)}</td><td>${fmt(o2)}</td><td>${dp2?dp2+"%":"&mdash;"}</td><td>${fmt(h2)}</td></tr>`;
      tc+=cur;tp+=pv;to+=o2;td2+=d2;th2+=h2;
    }
  }
  const dif2=tc-tp,dp3=to?Math.round(td2/to*100):0;
  html+=`</tbody><tfoot><tr><td class="left">Total (selected zones)</td><td>${fmt(metric==="dau"?dau:tc)}</td><td>${fmt(metric==="dau"?pdau:tp)}</td><td class="${dif2<0?"dip":"gain"}">${dif2>0?"+":""}${fmt(dif2)}</td><td>${fmt(to)}</td><td>${dp3?dp3+"%":"&mdash;"}</td><td>${fmt(th2)}</td></tr></tfoot>`;
  document.getElementById("zoneTable").innerHTML=html;
  renderCharts();
}

function onRangeChange(){
  const rf=document.getElementById("rangeFrom"),rt=document.getElementById("rangeTo");
  const fromIdx=DATA.findIndex(d=>d.date===rf.value);
  const toIdx=DATA.findIndex(d=>d.date===rt.value);
  if(toIdx<fromIdx){rt.value=rf.value}
  const span=DATA.findIndex(d=>d.date===rt.value)-DATA.findIndex(d=>d.date===rf.value)+1;
  if(span>7){
    const newFrom=Math.max(0,DATA.findIndex(d=>d.date===rt.value)-6);
    rf.value=DATA[newFrom].date;
    document.getElementById("rangeNote").textContent="Max 7 days — adjusted start date";
  } else {
    document.getElementById("rangeNote").textContent=span+" day"+(span>1?"s":"")+" selected";
  }
  renderRange();
}

function renderRange(){
  const rf=document.getElementById("rangeFrom").value;
  const rt=document.getElementById("rangeTo").value;
  const fromIdx=DATA.findIndex(d=>d.date===rf);
  const toIdx=DATA.findIndex(d=>d.date===rt);
  if(fromIdx<0||toIdx<0||toIdx<fromIdx)return;
  const days=DATA.slice(fromIdx,toIdx+1);
  const activeZones=getActiveZones();
  document.getElementById("rangeNote").textContent=days.length+" day"+(days.length>1?"s":"")+" selected";

  // Build table: rows = zone/city, cols = dates
  let cols='<th class="left">Zone / City</th>';
  days.forEach(d=>{const dt=new Date(d.date);const day=dt.toLocaleDateString("en-US",{weekday:"short"});cols+=`<th>${day}<br>${d.date.slice(5)}</th>`});
  cols+='<th>Avg</th><th>Trend</th>';
  let html=`<thead><tr>${cols}</tr></thead><tbody>`;

  let totals=days.map(()=>0);
  for(const z of activeZones){
    html+=`<tr class="zhdr"><td colspan="${days.length+3}">${z} Zone</td></tr>`;
    for(const c of CT[z]){
      const vals=days.map(d=>gM(d,z,c,"dau"));
      const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
      const trend=vals[vals.length-1]>=vals[0];
      let cells=vals.map((v,i)=>{
        const prev=i>0?vals[i-1]:v;
        const cls=v>prev?"cgrn":v<prev&&v>0?"cred":"";
        return `<td class="${cls}">${fmt(v)}</td>`;
      }).join("");
      vals.forEach((v,i)=>totals[i]+=v);
      html+=`<tr><td class="left">${c}</td>${cells}<td style="font-weight:600">${fmt(avg)}</td><td>${sparkMini(vals,trend)}</td></tr>`;
    }
  }
  // totals row
  const tAvg=totals.reduce((a,b)=>a+b,0)/totals.length;
  const tTrend=totals[totals.length-1]>=totals[0];
  let totCells=totals.map((v,i)=>{const prev=i>0?totals[i-1]:v;const cls=v>prev?"cgrn":v<prev&&v>0?"cred":"";return `<td class="${cls}">${fmt(v)}</td>`}).join("");
  html+=`</tbody><tfoot><tr><td class="left">Total</td>${totCells}<td>${fmt(tAvg)}</td><td>${sparkMini(totals,tTrend)}</td></tr></tfoot>`;
  document.getElementById("rangeTable").innerHTML=html;
}

function sparkMini(vals,up){
  const w=60,h=18,p=1,mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const pts=vals.map((v,i)=>`${p+i*(w-p*2)/(vals.length-1)},${h-p-(v-mn)/rng*(h-p*2)}`).join(" ");
  const lp=pts.split(" ").pop().split(",");
  const col=up?"var(--grn)":"var(--red)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="2" fill="${col}"/></svg>`;
}

function mkLine(svgId,vals,col,H,tipId,tipLabel){
  const svg=document.getElementById(svgId),tip=document.getElementById(tipId);
  const W=svg.parentElement.clientWidth-32,L=50,R=12,T=8,B=18,cw=W-L-R,ch=H-T-B;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const xf=i=>L+i*cw/(vals.length-1),yf=v=>T+ch-(v-mn)/rng*ch;
  let h="";
  for(let t=0;t<=3;t++){const v=mn+rng*t/3,y=yf(v);h+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${L-4}" y="${y+3.5}" text-anchor="end" font-size="9" fill="var(--fg-f)" font-family="JetBrains Mono">${Math.round(v).toLocaleString()}</text>`}
  DATA.forEach((d,i)=>{if(i%5===0||i===DATA.length-1)h+=`<text x="${xf(i)}" y="${H-2}" text-anchor="middle" font-size="9" fill="var(--fg-f)">${d.date.slice(5)}</text>`});
  h+=`<polyline points="${vals.map((v,i)=>xf(i)+","+yf(v)).join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  h+=`<circle cx="${xf(vals.length-1)}" cy="${yf(vals[vals.length-1])}" r="3" fill="${col}"/>`;
  vals.forEach((v,i)=>h+=`<rect x="${xf(i)-6}" y="${yf(v)-6}" width="12" height="12" fill="transparent" data-i="${i}" data-v="${v}" class="pt"/>`);
  svg.innerHTML+=h;
  svg.querySelectorAll(".pt").forEach(r=>{r.addEventListener("mouseenter",e=>{tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-10)+"px";tip.innerHTML=DATA[+r.dataset.i].date+"<br><b>"+Number(r.dataset.v).toLocaleString()+"</b> "+tipLabel});r.addEventListener("mouseleave",()=>tip.style.display="none")});
}
function renderCharts(){
  const activeZones=getActiveZones();
  document.getElementById("dauChart").innerHTML="";
  if(activeZones.length===ZONES.length){
    mkLine("dauChart",DATA.map(d=>d.total_unique_riders),"var(--acc)",180,"dauTip","riders");
  } else {
    mkLine("dauChart",DATA.map(d=>zT(d,activeZones[0],"dau")),ZC[activeZones[0]],180,"dauTip","riders");
  }
  const svg=document.getElementById("zoneChart"),tip=document.getElementById("zoneTip");
  const W=svg.parentElement.clientWidth-32,H=150,L=50,R=12,T=8,B=18,cw=W-L-R,ch=H-T-B;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  let mn=Infinity,mx=-Infinity;
  for(const z of activeZones){const v=DATA.map(d=>zT(d,z,"dau"));mn=Math.min(mn,...v);mx=Math.max(mx,...v)}
  const rng=mx-mn||1,xf=i=>L+i*cw/(DATA.length-1),yf=v=>T+ch-(v-mn)/rng*ch;
  let gh="";
  for(let t=0;t<=3;t++){const v=mn+rng*t/3,y=yf(v);gh+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${L-4}" y="${y+3.5}" text-anchor="end" font-size="9" fill="var(--fg-f)" font-family="JetBrains Mono">${Math.round(v).toLocaleString()}</text>`}
  DATA.forEach((d,i)=>{if(i%5===0||i===DATA.length-1)gh+=`<text x="${xf(i)}" y="${H-2}" text-anchor="middle" font-size="9" fill="var(--fg-f)">${d.date.slice(5)}</text>`});
  for(const z of activeZones){const vals=DATA.map(d=>zT(d,z,"dau")),c=ZC[z];gh+=`<polyline points="${vals.map((v,i)=>xf(i)+","+yf(v)).join(" ")}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><circle cx="${xf(vals.length-1)}" cy="${yf(vals[vals.length-1])}" r="3" fill="${c}"/>`;vals.forEach((v,i)=>gh+=`<rect x="${xf(i)-6}" y="${yf(v)-6}" width="12" height="12" fill="transparent" data-z="${z}" data-i="${i}" data-v="${v}" class="zp"/>`)}
  svg.innerHTML+=gh;
  svg.querySelectorAll(".zp").forEach(r=>{r.addEventListener("mouseenter",e=>{tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-10)+"px";tip.innerHTML=DATA[+r.dataset.i].date+"<br>"+r.dataset.z+": <b>"+Number(r.dataset.v).toLocaleString()+"</b> riders"});r.addEventListener("mouseleave",()=>tip.style.display="none")});
  document.getElementById("zoneLeg").innerHTML=activeZones.map(z=>`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-m)"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${ZC[z]}"></span>${z}</span>`).join("");
}
window.addEventListener("DOMContentLoaded",()=>{initSel();render()});
window.addEventListener("resize",renderCharts);
</script></body></html>
